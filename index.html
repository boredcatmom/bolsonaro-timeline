<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bolsonaro Family Timeline</title>
  <meta name="description" content="A sourced, interactive timeline of the Bolsonaro family in Brazilian politics.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Bolsonaro Family Timeline">
  <meta property="og:description" content="A sourced, interactive timeline of the Bolsonaro family in Brazilian politics.">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#timeline" data-i18n="ui.skipToTimeline">Skip to timeline</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <h1 data-i18n="ui.title">Bolsonaro Family Timeline</h1>
        <p data-i18n="ui.subtitle"></p>
      </div>
      <label class="lang-picker">
        <span class="sr-only" data-i18n="ui.language">Language</span>
        <select id="lang-select"></select>
      </label>
    </div>
  </header>

  <main class="wrap">
    <p class="notice" data-i18n="ui.notice"></p>

    <section class="controls" aria-labelledby="controls-heading">
      <h2 id="controls-heading" class="sr-only" data-i18n="ui.filters">Filters</h2>
      <input type="search" id="search" autocomplete="off" data-i18n-placeholder="ui.searchPlaceholder" data-i18n-aria-label="ui.searchPlaceholder">
      <fieldset>
        <legend data-i18n="ui.filterPeople">People</legend>
        <div id="people-filters" class="chips"></div>
      </fieldset>
      <fieldset>
        <legend data-i18n="ui.filterCategories">Categories</legend>
        <div id="category-filters" class="chips"></div>
      </fieldset>
      <div class="controls-footer">
        <p id="result-count" aria-live="polite"></p>
        <button type="button" id="clear-filters" class="link-button" data-i18n="ui.clearFilters">Clear filters</button>
      </div>
    </section>

    <ol id="timeline" class="timeline" aria-busy="true"></ol>
    <p id="empty" class="empty" hidden data-i18n="ui.noResults"></p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p data-i18n="ui.footer"></p>
      <p><a href="https://github.com/" id="repo-link" data-i18n="ui.contribute">Contribute on GitHub</a></p>
    </div>
  </footer>
</body>
</html>
